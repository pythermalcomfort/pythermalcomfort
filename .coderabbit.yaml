language: en-AU
tone_instructions: 'You must talk like a professional software engineer. Use technical terms and jargon where appropriate, but avoid overly complex language. Be concise and to the point, while still being friendly and approachable.'
early_access: false
enable_free_tier: true
reviews:
    profile: assertive
    request_changes_workflow: true
    high_level_summary: false
    high_level_summary_placeholder: '@coderabbitai summary'
    high_level_summary_in_walkthrough: false
    auto_title_placeholder: '@coderabbitai'
    auto_title_instructions: ''
    review_status: true
    commit_status: true
    fail_commit_status: false
    collapse_walkthrough: false
    changed_files_summary: true
    sequence_diagrams: true
    assess_linked_issues: true
    related_issues: true
    related_prs: true
    suggested_labels: true
    auto_apply_labels: false
    suggested_reviewers: true
    auto_assign_reviewers: false
    poem: false
    labeling_instructions: []
    path_filters:
        - '!**/*.csv'
        - '!**/*.epw'
        - '!**/*.xlsx'
        - '!examples/**/data/**'
    path_instructions: []
    abort_on_close: true
    disable_cache: false
    auto_review:
        enabled: true
        auto_incremental_review: false
        ignore_title_keywords: []
        labels: []
        drafts: false
        base_branches: ['master']
    finishing_touches:
        docstrings:
            enabled: true
        unit_tests:
            enabled: true
    tools:
        ast-grep:
            rule_dirs: []
            util_dirs: []
            essential_rules: true
            packages: []
        shellcheck:
            enabled: true
        ruff:
            enabled: true
        markdownlint:
            enabled: true
        github-checks:
            enabled: true
            timeout_ms: 90000
        languagetool:
            enabled: true
            enabled_rules: []
            disabled_rules: []
            enabled_categories: []
            disabled_categories: []
            enabled_only: false
            level: default
        biome:
            enabled: false
        hadolint:
            enabled: false
        swiftlint:
            enabled: false
        phpstan:
            enabled: false
            level: default
        golangci-lint:
            enabled: false
        yamllint:
            enabled: true
        gitleaks:
            enabled: true
        checkov:
            enabled: false
        detekt:
            enabled: false
        eslint:
            enabled: false
        rubocop:
            enabled: false
        buf:
            enabled: false
        regal:
            enabled: false
        actionlint:
            enabled: true
        pmd:
            enabled: false
        cppcheck:
            enabled: false
        semgrep:
            enabled: true
        circleci:
            enabled: false
        sqlfluff:
            enabled: false
        prismaLint:
            enabled: false
        oxc:
            enabled: false
        shopifyThemeCheck:
            enabled: false
        luacheck:
            enabled: false
chat:
    auto_reply: true
    integrations:
        jira:
            usage: auto
        linear:
            usage: auto
knowledge_base:
    opt_out: false
    web_search:
        enabled: true
    learnings:
        scope: auto
    issues:
        scope: auto
    jira:
        usage: auto
        project_keys: []
    linear:
        usage: auto
        team_keys: []
    pull_requests:
        scope: auto
code_generation:
    docstrings:
        language: en-US
        path_instructions: []
    unit_tests:
        path_instructions: []
