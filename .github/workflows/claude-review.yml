name: Claude Review

# CodeRabbit and Copilot review PRs into master. This workflow reviews PRs into
# development: Haiku runs once when a PR opens, Sonnet runs when a maintainer
# comments "@claude" on a PR.

on:
    pull_request:
        types: [ opened, ready_for_review ]
        branches:
            - development
    issue_comment:
        types: [ created ]

jobs:

    auto-review:

        # fork PRs get no secrets, so a maintainer reviews them with an @claude comment
        if: >
            github.event_name == 'pull_request' &&
            !github.event.pull_request.draft &&
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            id-token: write

        steps:
            -   uses: actions/checkout@v6.0.2
                with:
                    fetch-depth: 1
            -   name: Review with Claude Haiku
                uses: anthropics/claude-code-action@v1
                with:
                    anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                    prompt: |
                        REPO: ${{ github.repository }}
                        PR NUMBER: ${{ github.event.pull_request.number }}

                        Review this PR for correctness bugs, wrong physics or units,
                        and missing tests. Skip style issues, because ruff checks them.
                        Post at most 5 inline comments, most important first.
                        Write each fix as a GitHub suggestion block so the author can
                        commit it with one click. End with a one-paragraph summary.
                    claude_args: |
                        --model claude-haiku-5-5
                        --max-turns 15
                        --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

    on-demand-review:

        # only maintainers can trigger a review, so outsiders cannot spend the API budget
        if: >
            github.event_name == 'issue_comment' &&
            github.event.issue.pull_request &&
            contains(github.event.comment.body, '@claude') &&
            contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association)
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            issues: write
            id-token: write

        steps:
            -   uses: actions/checkout@v6.0.2
                with:
                    fetch-depth: 1
            -   name: Review with Claude Sonnet
                uses: anthropics/claude-code-action@v1
                with:
                    anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                    claude_args: |
                        --model claude-sonnet-5-5
                        --max-turns 25
                        --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
                        --append-system-prompt "When asked to review, focus on correctness bugs, wrong physics or units, and missing tests. Post at most 5 inline comments and write each fix as a GitHub suggestion block."
