name: Claude Review

# CodeRabbit and Copilot review PRs into master. This workflow reviews PRs into
# development: Haiku runs when a PR opens and on every push, Sonnet runs when a
# maintainer comments "@claude" on a PR.

on:
    pull_request:
        types: [ opened, synchronize, ready_for_review ]
        branches:
            - development
    issue_comment:
        types: [ created ]

jobs:

    auto-review:

        # a new push cancels the review of the previous one
        concurrency:
            group: claude-review-${{ github.event.pull_request.number }}
            cancel-in-progress: true

        # fork PRs get no OIDC token, so a maintainer reviews them with an @claude comment
        if: >
            github.event_name == 'pull_request' &&
            !github.event.pull_request.draft &&
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            id-token: write

        steps:
            -   uses: actions/checkout@v6.0.2
                with:
                    fetch-depth: 1
            -   name: Review with Claude Haiku
                uses: anthropics/claude-code-action@v1
                with:
                    # workload identity federation: the job's GitHub OIDC token is exchanged for a
                    # short-lived Claude API token, so no API key is stored. These are IDs, not secrets.
                    anthropic_federation_rule_id: fdrl_011pveDrFkm14XCPsh4tWk8L
                    anthropic_organization_id: a62f5bc4-c745-4716-b3ee-b5950d745127
                    anthropic_service_account_id: svac_01Cnj6nwjH2wucxXAK47chm8
                    anthropic_workspace_id: wrkspc_017KVQw4mCovgzMMzfAwJ37Q
                    # posts a tracking comment that Claude fills in with the summary
                    track_progress: true
                    # edits the same tracking comment on every push, rather than adding one each time
                    use_sticky_comment: true
                    # lists the tool calls in the job summary, safe because fork PRs never reach this job
                    display_report: true
                    prompt: |
                        REPO: ${{ github.repository }}
                        PR NUMBER: ${{ github.event.pull_request.number }}

                        Review this PR for correctness bugs, wrong physics or units,
                        and missing tests. Skip style issues, because ruff checks them.

                        This PR may already have review threads from your earlier runs.
                        List them first with this GraphQL query:

                        gh api graphql -F owner=${{ github.repository_owner }} -F name=${{ github.event.repository.name }} -F pr=${{ github.event.pull_request.number }} -f query='query($owner: String!, $name: String!, $pr: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $pr) { reviewThreads(first: 100) { nodes { id isResolved path line comments(first: 1) { nodes { author { login } body } } } } } } }'

                        For each unresolved thread whose first comment is yours (author
                        login "claude"): if the current code fixes the problem, resolve it
                        with the resolveReviewThread mutation. Never resolve threads that
                        other reviewers or people started. Never post a comment on a
                        problem that an existing thread already raises, resolved or not.

                        Post at most 5 new inline comments, most important first.
                        Write each fix as a GitHub suggestion block so the author can
                        commit it with one click. Write a one-paragraph summary in
                        your tracking comment, and say which threads you resolved.
                    claude_args: |
                        --model claude-haiku-5-5
                        --max-turns 30
                        --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh api graphql:*),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

    on-demand-review:

        # only maintainers can trigger a review, so outsiders cannot spend the API budget
        if: >
            github.event_name == 'issue_comment' &&
            github.event.issue.pull_request &&
            contains(github.event.comment.body, '@claude') &&
            contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association)
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            issues: write
            id-token: write

        steps:
            -   uses: actions/checkout@v6.0.2
                with:
                    fetch-depth: 1
            -   name: Review with Claude Sonnet
                uses: anthropics/claude-code-action@v1
                with:
                    # workload identity federation: the job's GitHub OIDC token is exchanged for a
                    # short-lived Claude API token, so no API key is stored. These are IDs, not secrets.
                    anthropic_federation_rule_id: fdrl_011pveDrFkm14XCPsh4tWk8L
                    anthropic_organization_id: a62f5bc4-c745-4716-b3ee-b5950d745127
                    anthropic_service_account_id: svac_01Cnj6nwjH2wucxXAK47chm8
                    anthropic_workspace_id: wrkspc_017KVQw4mCovgzMMzfAwJ37Q
                    claude_args: |
                        --model claude-sonnet-5-5
                        --max-turns 40
                        --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
                        --append-system-prompt "When asked to review, focus on correctness bugs, wrong physics or units, and missing tests. Post at most 5 inline comments and write each fix as a GitHub suggestion block."
