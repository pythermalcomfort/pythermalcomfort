# This file only defines the development environment for `uv sync`.
# The package metadata and what users install still come from setup.py and setup.cfg.
[dependency-groups]
dev = [
    "pythermalcomfort",  # the repo itself, installed in editable mode (see [tool.uv.sources])
    "scipy",
    "numba",
    "numpy",
    "tox",
    "tabulate",
    "matplotlib",
    "seaborn",
    "ruff==0.16.3",  # keep in sync with the ruff-pre-commit rev in .pre-commit-config.yaml
    "docformatter",
    "autopep8",
    "bump-my-version",
    "twine",
    "readme-renderer",
    "pre-commit",
    "blacken-docs",
    "pytest>=9.0.3",  # CVE-2025-71176: fixed in 9.0.3+
    "pytest-cov",  # provides the --cov options used in CLAUDE.md and tox.ini
    "pytest-xdist",  # enables `pytest -n auto` to run tests across CPU cores
    "filelock>=3.20.3",  # CVE-2025-68146: fixed in 3.20.1+; CVE-2026-22701: fixed in 3.20.3+
    "requests>=2.33.0",  # CVE-2024-47081: fixed in 2.32.4+; CVE-2026-25645: fixed in 2.33.0+
    "setuptools>=78.1.1",  # CVE-2025-47273: fixed in 78.1.1+
    "pandas",
]

[tool.uv]
# uv 0.8.18 is the first version that accepts a pyproject.toml without a [project] table
required-version = ">=0.8.18"

[tool.uv.sources]
pythermalcomfort = { path = ".", editable = true }
